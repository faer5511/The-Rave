<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>THE RAVE — вход администратора</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <main class="wrap">
    <form class="card" id="adminLogin" style="max-width:380px;margin:12vh auto">
      <h1>THE RAVE</h1>
      <label for="login">Логин</label>
      <input id="login" autocomplete="username" placeholder="Введите логин" required>
      <label for="password">Пароль</label>
      <input id="password" type="password" autocomplete="current-password">
      <button class="btn red" type="submit" style="width:100%;margin-top:16px">Войти в админку</button>
      <p id="message" style="color:#ff8a8a"></p>
    </form>
  </main>
  <script type="module" src="/js/admin-login.js"></script>
</body>
</html>
